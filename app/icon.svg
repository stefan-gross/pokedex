<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- App-Hintergrund (Theme-Dunkel), gerundete Kachel -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="#0f1117"/>

  <!-- Pokéball-Körper (gläsern-hell) -->
  <circle cx="16" cy="16" r="11.5" fill="#eef2f8"/>
  <!-- obere rote Hälfte -->
  <path d="M4.5 16 A11.5 11.5 0 0 1 27.5 16 Z" fill="#e53935"/>
  <!-- Mittelband -->
  <rect x="4.5" y="14.5" width="23" height="3" fill="#0f1117"/>
  <!-- Mittelknopf -->
  <circle cx="16" cy="16" r="3.8" fill="#0f1117"/>
  <circle cx="16" cy="16" r="2" fill="#eef2f8"/>

  <!-- Liquid-Glass-Schimmer (Reflexbogen oben links) -->
  <path d="M7.5 10.5 A11.5 11.5 0 0 1 20 6.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.8" stroke-linecap="round"/>
